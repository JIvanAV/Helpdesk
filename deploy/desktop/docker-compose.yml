services:
  ivan-helpdesk:
    build:
      context: ../..
      dockerfile: deploy/desktop/Dockerfile
    image: ivan-helpdesk:local
    container_name: ivan-helpdesk
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - helpdesk-data:/app/deploy/desktop/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  helpdesk-data:
    name: ivan-helpdesk-data
