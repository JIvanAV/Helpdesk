<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivan Helpdesk — Portal de Chamados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* Dark Mode Global */
    :root {
      --bg: #020617;
      --card: #0f172a;
      --text: #f1f5f9;
    }
    body.dark-mode {
      --bg: #ffffff;
      --card: #f8fafc;
      --text: #0f172a;
    }
    body { background-color: var(--bg); color: var(--text); }
    .bg-custom-card { background-color: var(--card); }
  </style>
</head>
<body class="min-h-screen transition-colors duration-300" x-data="helpdeskApp()" x-init="init()" :class="darkMode ? 'dark-mode' : ''">
  <main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-8 flex flex-col gap-4 rounded-3xl border border-slate-800 bg-slate-900/70 p-6 shadow-2xl md:flex-row md:items-center md:justify-between">
      <div>
        <p class="mb-2 inline-flex rounded-full bg-blue-500/10 px-3 py-1 text-sm font-semibold text-blue-300 shadow-sm ring-1 ring-inset ring-blue-500/20">Portfólio Helpdesk • FastAPI + SQLite</p>
        <h1 class="text-3xl font-bold tracking-tight text-white md:text-4xl">Ivan Helpdesk</h1>
      </div>
      <div class="flex gap-3 text-sm">
      <button class="rounded-xl bg-slate-800 px-4 py-2 font-semibold text-white hover:bg-slate-700" @click="darkMode = !darkMode" x-text="darkMode ? 'Modo Escuro' : 'Modo Claro'"></button>
      <a class="rounded-xl bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-500" href="/docs" target="_blank">Swagger</a>
      <a class="rounded-xl bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-500" href="/tickets/export.csv" target="_blank">Exportar CSV</a>
      <button class="rounded-xl bg-slate-800 px-4 py-2 font-semibold text-slate-100 hover:bg-slate-700" @click="loadAll()">Atualizar</button>
      </div>
    </header>

    <div class="grid gap-6 lg:grid-cols-[0.95fr_1.4fr]">
      <section class="rounded-3xl border border-slate-800 bg-custom-card p-6 shadow-xl">
        <h2 class="mb-4 text-xl font-bold">Novo chamado</h2>
        <form class="space-y-4" @submit.prevent="createTicket()">
          <label class="block">
            <span class="mb-1 block text-sm">Título</span>
            <input class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 outline-none" x-model="form.title" required placeholder="Ex.: Computador não liga" />
          </label>
          <button class="w-full rounded-xl bg-blue-600 px-4 py-3 font-bold text-white hover:bg-blue-500" type="submit">Abrir chamado</button>
        </form>
      </section>

      <section class="rounded-3xl border border-slate-800 bg-custom-card p-6">
        <h2 class="mb-4 text-xl font-bold">Chamados</h2>
        <div class="space-y-3">
          <template x-for="ticket in tickets" :key="ticket.id">
            <article class="rounded-2xl border border-slate-800 p-4">
              <h3 class="font-bold" x-text="ticket.title"></h3>
              <p class="text-sm" x-text="ticket.status"></p>
            </article>
          </template>
        </div>
      </section>
    </div>
  </main>

  <script>
    function helpdeskApp() {
      return {
        darkMode: false,
        tickets: [],
        form: { title: '', description: 'Teste de chamado', category: 'software', priority: 'media', requester_name: 'José', requester_email: 'jose@teste.com', origin: 'portal' },
        async init() { await this.loadTickets(); },
        async loadTickets() {
          const res = await fetch('/tickets');
          const data = await res.json();
          this.tickets = data.tickets || [];
        },
        async createTicket() {
            await fetch('/tickets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.form) });
            await this.loadTickets();
        }
      }
    }
  </script>
</body>
</html>
